version: '3.8'

services:
  db-init:
    image: postgres:15-alpine
    container_name: libramanager_db_init
    restart: "no"
    env_file:
      - .env
    command: >
      sh -c "
        export PGPASSWORD=\"$$SHARED_POSTGRES_PASSWORD\";
        until pg_isready -h \"$$SHARED_POSTGRES_HOST\" -p \"$$SHARED_POSTGRES_PORT\" -U \"$$SHARED_POSTGRES_USER\"; do
          sleep 2;
        done;
        if ! psql -h \"$$SHARED_POSTGRES_HOST\" -p \"$$SHARED_POSTGRES_PORT\" -U \"$$SHARED_POSTGRES_USER\" -d postgres -tAc \"SELECT 1 FROM pg_database WHERE datname = '$$APP_POSTGRES_DB'\" | grep -q 1; then
          psql -h \"$$SHARED_POSTGRES_HOST\" -p \"$$SHARED_POSTGRES_PORT\" -U \"$$SHARED_POSTGRES_USER\" -d postgres -v ON_ERROR_STOP=1 -c \"CREATE DATABASE \\\"$$APP_POSTGRES_DB\\\"\";
        fi
      "
    networks:
      - devportfolio_default

  # Serviço da API (Backend)
  backend:
    build:
      context: ./biblioteca-emprestimos-api
      dockerfile: Dockerfile
    container_name: libramanager-api
    env_file:
      - ./biblioteca-emprestimos-api/.env
    restart: unless-stopped
    ports:
      - "3333:3333"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - libramanager-network
      - devportfolio_default
    volumes:
      - ./biblioteca-emprestimos-api:/usr/app
      - /usr/app/node_modules

  # Serviço da UI (Frontend)
  frontend:
    build:
      context: ./biblioteca-emprestimos-ui
      dockerfile: Dockerfile
    container_name: libramanager-ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3333
    depends_on:
      - backend
    networks:
      - libramanager-network
    volumes:
      - ./biblioteca-emprestimos-ui:/app
      - /app/node_modules

networks:
  libramanager-network:
    driver: bridge
  devportfolio_default:
    external: true
